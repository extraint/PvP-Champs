<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PvP Champs Bracket</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Press+Start+2P&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#06070b;--panel:#0d0f16;--card:#11141d;--line:#1f2432;--text:#f4f1e8;--mute:#8d93a5;--gold:#ffc83d;--live:#ff3b4e;--accent:#ffc83d;--head:Oswald,"Arial Narrow",Impact,sans-serif;--px:"Press Start 2P",monospace}

*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--text);font:14px/1.4 Inter,system-ui,Segoe UI,sans-serif;background-image:radial-gradient(900px 380px at 50% -120px,rgba(255,200,61,.13),transparent),linear-gradient(transparent 31px,rgba(255,255,255,.025) 32px),linear-gradient(90deg,transparent 31px,rgba(255,255,255,.025) 32px);background-size:auto,32px 32px,32px 32px}
header{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top{max-width:1500px;margin:0 auto;padding:14px 16px 0;display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.logo{font-family:var(--px);font-size:15px;letter-spacing:.04em;line-height:1.5;text-shadow:2px 2px 0 #000}.logo b{color:var(--gold);text-shadow:2px 2px 0 #7a5200}
.sub{color:var(--mute);font-size:12px;padding-bottom:3px}
nav{display:flex;gap:2px;margin-left:auto;overflow-x:auto}
nav button{background:none;border:0;color:var(--mute);padding:10px 14px;font-family:var(--head);font-size:15px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;cursor:pointer;border-bottom:2px solid transparent}
nav button.on{color:var(--text);border-color:var(--gold)}
main{max-width:1500px;margin:0 auto;padding:18px 16px 60px}
.sec{font-family:var(--head);font-size:16px;color:var(--gold);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:22px 0 10px;display:flex;align-items:center;gap:10px}
.sec i{flex:1;height:1px;background:var(--line)}
.scroll{overflow-x:auto;padding-bottom:8px}.grid{display:flex;gap:34px;min-width:max-content}
.col{display:flex;flex-direction:column;width:210px}
.colh{font-family:var(--head);font-size:14px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;display:flex;justify-content:space-between}
.col .ms{flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:10px}
.m{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:3px;position:relative;cursor:pointer;transition:border-color .15s}
.m:hover{border-color:var(--gold)}
.m.live{border-color:var(--live);border-left-color:var(--live);box-shadow:0 0 18px rgba(255,59,78,.35)}
.col:not(:last-child) .m::after{content:"";position:absolute;right:-18px;top:50%;width:18px;border-top:2px solid var(--line)}
.col:not(:first-child) .m::before{content:"";position:absolute;left:-18px;top:50%;width:18px;border-top:2px solid var(--line)}
.p{display:flex;align-items:center;gap:8px;padding:7px 9px;height:32px}
.p+.p{border-top:1px solid var(--line)}
.p img{width:18px;height:18px;border-radius:0;image-rendering:pixelated;background:var(--line)}
.p .nm{font-family:var(--head);font-size:15px;letter-spacing:.02em;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.p .sc{font-variant-numeric:tabular-nums;font-weight:700;min-width:14px;text-align:right}
.p.tbd .nm{color:var(--mute);font-weight:400;font-style:italic}
.p.win{background:linear-gradient(90deg,rgba(255,200,61,.22),transparent)}.p.win .sc{color:var(--gold)}
.p.lose{opacity:.5}
.badge{position:absolute;top:-9px;right:8px;background:var(--live);color:#fff;font-family:var(--px);font-size:7px;padding:3px 6px;border-radius:2px;letter-spacing:.06em}
.badge::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#fff;margin-right:4px;animation:p 1.2s infinite}@keyframes p{50%{opacity:.25}}
.champ{background:linear-gradient(135deg,rgba(245,185,66,.2),transparent);border:1px solid var(--gold);border-radius:10px;padding:16px;text-align:center;margin-top:12px;width:210px}
.champ small{font-family:var(--px);font-size:8px;color:var(--gold)}.champ div{font-family:var(--head);font-size:28px;font-weight:700;margin-top:6px;text-transform:uppercase}
.empty{color:var(--mute);padding:30px 0;text-align:center}
.panel{background:var(--panel);border:1px solid var(--line);border-top:2px solid var(--gold);border-radius:3px;padding:14px;margin-bottom:12px}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center}
.vs .big{font-family:var(--px);font-size:22px;color:var(--gold);text-align:center;min-width:90px}.r{text-align:right}
.bar{height:8px;background:var(--line);border-radius:0;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%}
.tag{background:var(--gold);color:#1a1300;font-family:var(--head);font-weight:600;letter-spacing:.06em;text-transform:uppercase;border-radius:2px;padding:2px 9px;font-size:12px}
table{width:100%;border-collapse:collapse}th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}
th{font-family:var(--head);color:var(--gold);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.05em}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.mute{color:var(--mute)}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--gold);border-radius:3px;padding:20px;min-width:300px;max-width:440px}
dialog::backdrop{background:rgba(0,0,0,.6)}dialog h3{margin:0 0 4px;font-family:var(--head);font-size:22px;color:var(--gold);text-transform:uppercase;letter-spacing:.06em}dialog ul{padding-left:18px;margin:10px 0}
dialog button{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 14px;cursor:pointer}
.gear{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.arm{display:flex;gap:6px;margin-bottom:8px}.r .arm{justify-content:flex-end}
.pc{width:52px}.pc small{display:block;color:var(--mute);font-size:10px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .d{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.pc .d i{display:block;height:100%}
.pc em{font-style:normal;font-size:11px;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:4px}.r .chips{justify-content:flex-end}
.chip{background:var(--card);border:1px solid var(--line);border-radius:2px;padding:1px 7px;font-size:12px;white-space:nowrap}
.chip.hb{border-color:var(--gold)}.gl{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em;margin:6px 0 3px}

.slot{position:relative;width:38px;height:38px;background:#1a1d27;border:2px solid #0a0b10;border-top-color:#05060a;border-left-color:#05060a;border-right-color:#2a2f3f;border-bottom-color:#2a2f3f;display:flex;align-items:center;justify-content:center;flex:none}
.slot img{width:26px;height:26px;image-rendering:pixelated}
.slot b{position:absolute;right:1px;bottom:-1px;font:700 11px/1 var(--head);color:#fff;text-shadow:1px 1px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000;letter-spacing:.02em}
.slot.empty{opacity:.45}.slot .tile{font:700 9px/1 var(--head);color:var(--mute);text-transform:uppercase;text-align:center;word-break:break-all;padding:2px}
.slot.pot{box-shadow:inset 0 0 0 2px var(--pc,transparent)}
.slots{display:flex;flex-wrap:wrap;gap:3px}.r .slots{justify-content:flex-end}
.armrow{display:flex;gap:6px;align-items:flex-end;margin:12px 0 4px}.r .armrow{justify-content:flex-end}
.arm1{width:42px;text-align:center}.arm1 .slot{margin:0 auto 3px}
.dur{height:5px;background:#05060a;border:1px solid #2a2f3f}.dur i{display:block;height:100%}
.arm1 em{font:600 11px var(--head);font-style:normal;color:var(--mute)}
.fh{display:flex;gap:12px;align-items:center}.r .fh{flex-direction:row-reverse;text-align:right}
.fh img.body{height:84px;image-rendering:pixelated;filter:drop-shadow(0 4px 6px rgba(0,0,0,.6))}
.fh .nm{font:700 22px var(--head);text-transform:uppercase;letter-spacing:.04em}
.hearts{display:flex;gap:1px;font-size:15px;line-height:1}.r .hearts{justify-content:flex-end}
.hearts span{color:#3a2026}.hearts .f{color:#ff3b4e}.hearts .h{background:linear-gradient(90deg,#ff3b4e 50%,#3a2026 50%);-webkit-background-clip:text;background-clip:text;color:transparent}.hearts .g{color:#ffc83d}
.gl{font:600 11px var(--head);color:var(--gold);text-transform:uppercase;letter-spacing:.14em;margin:10px 0 4px}
.pill{display:inline-flex;gap:6px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:3px 10px;font-size:12px;color:var(--mute)}
.pill i{width:8px;height:8px;border-radius:50%;background:#3ddc97;display:inline-block}.pill.off i{background:var(--live)}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px}.stat{background:var(--panel);border:1px solid var(--line);border-top:2px solid var(--gold);padding:8px 14px;min-width:110px}
.stat b{display:block;font:700 24px var(--head);color:var(--gold)}.stat span{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
.next{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px}.nx{background:var(--panel);border:1px solid var(--line);padding:6px 10px;font-size:13px;display:flex;gap:6px;align-items:center}
.nx img{width:18px;height:18px}.nx .vs2{color:var(--mute);font-size:11px}
.pbar{height:6px;background:var(--line);margin:3px 0 8px}.pbar i{display:block;height:100%;background:var(--gold)}
tr.pl{cursor:pointer}tr.pl:hover td{background:rgba(255,200,61,.06)}
.kitrow{display:grid;grid-template-columns:110px 1fr 60px;gap:8px;align-items:center;margin:4px 0;font-size:13px}
.kitrow .pbar{margin:0}
.view{display:none}.view.on{display:block}
@media(max-width:560px){.hide{display:none}}
</style></head><body>
<header><div class="top"><div class="logo">PVP <b>CHAMPS</b> II</div><span class="pill" id="conn"><i></i><span>connecting</span></span><div class="sub" id="sub">Double elimination · 16 players</div>
<nav><button data-v="bracket" class="on">Bracket</button><button data-v="live">Live</button><button data-v="board">Leaderboard</button><button data-v="results">Results</button></nav></div></header>
<main>
<div class="view on" id="v-bracket"><div class="stats" id="sumstats"></div><div id="nextup"></div><div id="bk"></div></div>
<div class="view" id="v-live"><div id="live"></div></div>
<div class="view" id="v-board"><div class="panel"><table id="board"><thead><tr><th>#</th><th>Player</th><th class="n">Matches</th><th class="n">Win %</th><th class="n hide">Rounds</th><th class="hide">Best kit</th></tr></thead><tbody></tbody></table></div></div>
<div class="view" id="v-results"><div class="panel"><table id="hist"><tbody></tbody></table></div></div>
</main>
<dialog id="dlg"></dialog>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct=(w,l)=>w+l?Math.round(100*w/(w+l))+'%':'-';
const head=n=>`<img src="https://mc-heads.net/avatar/${encodeURIComponent(n)}/36" alt="" onerror="this.style.visibility='hidden'">`;
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button,.view').forEach(e=>e.classList.remove('on'));b.classList.add('on');$('#v-'+b.dataset.v).classList.add('on')});

{const t=location.hash.slice(1);const b=t&&document.querySelector(`nav button[data-v="${t}"]`);if(b)b.click()}
let SER=[];
function card(s){
  const sc=(s.score||'').split('-'), done=s.state==='done';
  const row=(n,mine)=>{
    if(!n)return `<div class="p tbd"><span class="nm">TBD</span><span class="sc"></span></div>`;
    const win=done&&s.winner===n, lose=done&&s.winner!==n;
    const v=done&&sc.length===2?(win?sc[0]:sc[1]):'';
    return `<div class="p ${win?'win':''} ${lose?'lose':''}">${head(n)}<span class="nm">${esc(n)}</span><span class="sc">${v}</span></div>`};
  return `<div class="m ${s.state==='live'?'live':''}" data-n="${s.n}">${s.state==='live'?'<span class="badge">LIVE</span>':''}${row(s.a)}${row(s.b)}</div>`;
}
function col(title,list){return `<div class="col"><div class="colh"><span>${title}</span><span>Bo${list[0]?.bestOf||3}</span></div><div class="ms">${list.map(card).join('')}</div></div>`}
function bracket(d){
  const s=d.series||[]; SER=s; window.BK=d; sum(); nextUp(s);
  if(!s.length){$('#bk').innerHTML='<div class="empty">No tournament running yet.<br>In the game, run <b>/pvpchamps tournament start</b> and the bracket fills in here live.</div>';return}
  const by=p=>s.filter(x=>x.label.startsWith(p));
  const up=[['Round 1','Upper Round 1'],['Round 2','Upper Round 2'],['Round 3','Upper Round 3'],['Upper Final','Upper Final']];
  const lo=[['Round 1','Lower Round 1'],['Round 2','Lower Round 2'],['Round 3','Lower Round 3'],['Round 4','Lower Round 4'],['Round 5','Lower Round 5'],['Lower Final','Lower Final']];
  const live=s.find(x=>x.state==='live');
  $('#sub').textContent=d.finished?`Finished · ${d.champion} wins`:live?`${live.label.replace(/ \(.*/,'')} · ${live.a||'TBD'} vs ${live.b||'TBD'}`:'Double elimination · 16 players';
  const gf=by('Grand Final')[0];
  $('#bk').innerHTML=`<div class="sec">Upper bracket<i></i></div><div class="scroll"><div class="grid">${up.map(([t,p])=>col(t,by(p))).join('')}${col('Grand Final',[gf])}</div></div>
  <div class="sec">Lower bracket<i></i></div><div class="scroll"><div class="grid">${lo.map(([t,p])=>col(t,by(p))).join('')}</div></div>
  ${d.champion?`<div class="champ"><small>CHAMPION</small><div>${esc(d.champion)}</div></div>`:''}`;
  document.querySelectorAll('.m').forEach(m=>m.onclick=()=>detail(+m.dataset.n));
}
function detail(n){
  const s=SER[n-1]; if(!s)return;
  $('#dlg').innerHTML=`<h3>${esc(s.label)}</h3><div class="mute">Best of ${s.bestOf} · ${s.state==='live'?'in progress':s.state==='done'?'finished':'not played yet'}</div>
  <p><b>${esc(s.a||'TBD')}</b> vs <b>${esc(s.b||'TBD')}</b>${s.winner?`<br>Winner: <b>${esc(s.winner)}</b>${s.score?' ('+esc(s.score)+')':' (skipped)'}`:''}</p>
  ${s.draft?.length?`<div class="mute">Kit draft</div><ul>${s.draft.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
  <button onclick="this.closest('dialog').close()">Close</button>`;
  $('#dlg').showModal();
}
const VER=['1.21.11','1.21.4'];
const OVR={crossbow:'items/crossbow_standby',cobweb:'blocks/cobweb',oak_planks:'blocks/oak_planks',rail:'blocks/rail',shulker_box:'blocks/shulker_box',
  potion:'items/splash_potion',lingering_potion:'items/lingering_potion',tnt_minecart:'items/tnt_minecart'};
const POTCOL={strength:'#932423',strong_strength:'#932423',swiftness:'#7cafc6',long_swiftness:'#7cafc6',strong_swiftness:'#7cafc6',healing:'#f82423',strong_healing:'#f82423',
  fire_resistance:'#e49a3a',long_fire_resistance:'#e49a3a',regeneration:'#cd5cab',long_regeneration:'#cd5cab',strong_regeneration:'#cd5cab',slow_falling:'#f7f8e0',water_breathing:'#2e5299',night_vision:'#1f1fa1'};
const iconBase='https://cdn.jsdelivr.net/gh/PrismarineJS/minecraft-assets@master/data/';
function cands(id){
  const base=String(id).split(':')[0];
  if(base==='shield')return["data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'><path d='M2 1h12v9l-2 3-4 2-4-2-2-3z' fill='%23473625'/><path d='M3 2h10v8l-2 2-3 2-3-2-2-2z' fill='%23865a34'/><path d='M3 2h5v12l-3-2-2-2z' fill='%23a97748'/><path d='M7 2h2v12H7z' fill='%23d5d8dd'/><path d='M3 6h10v2H3z' fill='%23d5d8dd'/></svg>"];
  const paths=OVR[base]?[OVR[base]]:['items/'+base,'blocks/'+base];
  if(OVR[base]){paths.push('items/'+base,'blocks/'+base)}
  const out=[];for(const v of VER)for(const p of paths)out.push(iconBase+v+'/'+p+'.png');return out}
function nx(img){const l=(img.dataset.c||'').split('|').filter(Boolean);const i=+img.dataset.i||0;
  if(i<l.length){img.dataset.i=i+1;img.src=l[i]}else{const t=document.createElement('div');t.className='tile';t.textContent=img.dataset.n;img.replaceWith(t)}}
window.nx=nx;
const nice=id=>{const[b,p]=String(id).split(':');return b.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase())+(p?' ('+p.replace(/_/g,' ')+')':'')};
function slot(id,count,extra){
  if(!id)return '<div class="slot empty"></div>';
  const pot=String(id).includes(':')?String(id).split(':')[1]:'';
  const c=cands(id);
  const st=pot&&POTCOL[pot]?` style="--pc:${POTCOL[pot]}"`:'';
  const short=String(id).split(':')[0].replace(/_/g,' ').slice(0,10);
  return `<div class="slot ${pot?'pot':''}" title="${esc(nice(id))}${count>1?' ×'+count:''}"${st}><img src="${c[0]}" data-i="1" data-c="${c.join('|')}" data-n="${esc(short)}" onerror="nx(this)" alt="">${count>1?`<b>${count}</b>`:''}</div>`}
function parse(t){const m=String(t).match(/^(.*?) x(\d+)$/);return m?[m[1],+m[2]]:[t,1]}
const durCol=v=>v>60?'#3ddc97':v>30?'#ffc83d':'#ff4d5e';
const PIECES=['Helmet','Chest','Legs','Boots'];
function hearts(v){let h='';for(let i=0;i<10;i++){const left=v-i*2;const c=left>=2?'f':left>=1?'h':'';h+=`<span class="${c}">♥</span>`}
  if(v>20)h+=`<span class="g">+${Math.round((v-20)/2)}</span>`;return `<div class="hearts" title="${(v/2).toFixed(1)} hearts">${h}</div>`}
function gear(g){ if(!g)return '';
  const arm=g.armor.map((a,i)=>`<div class="arm1" title="${PIECES[i]}${a?': '+esc(nice(a))+' '+g.armorDura[i]+'%':''}">${slot(a,1)}<div class="dur"><i style="width:${a?g.armorDura[i]:0}%;background:${durCol(g.armorDura[i])}"></i></div><em>${a?g.armorDura[i]+'%':'—'}</em></div>`).join('');
  const off=g.offhand?parse(g.offhand):null;
  const hb=(g.hotbar||[]).map(x=>{if(!x)return slot(null);const[n,c]=parse(x);return slot(n,c)}).join('');
  const mats=Object.entries(g.materials||{}).sort((a,b)=>b[1]-a[1]).map(([k,v])=>slot(k,v)).join('');
  return `<div class="armrow">${arm}<div class="arm1" title="Offhand">${slot(off?off[0]:null,off?off[1]:1)}<div class="dur" style="visibility:hidden"></div><em>Offhand</em></div></div>
  <div class="gl">Hotbar</div><div class="slots">${hb}</div>
  <div class="gl">Materials</div><div class="slots">${mats}</div>`}
const body=n=>`<img class="body" src="https://mc-heads.net/body/${encodeURIComponent(n)}/120" alt="" onerror="this.style.visibility='hidden'">`;
const hpw=v=>Math.max(0,Math.min(100,v/20*100));
function fighter(n,hp,g,right){return `<div class="${right?'r':''}"><div class="fh">${body(n)}<div><div class="nm">${esc(n)}</div>${hearts(hp)}</div></div>${gear(g)}</div>`}
async function live(){try{
  const l=await (await fetch('/api/live')).json();conn(true);
  $('#live').innerHTML=l.length?l.map(m=>`<div class="panel"><div style="display:flex;gap:10px;align-items:center;margin-bottom:10px"><span class="tag">${esc(m.kit)}</span><span class="mute">${esc(m.round||'')}</span><span style="flex:1"></span><span class="mute">best of ${m.bestOf}</span></div>
  <div class="vs" style="align-items:start">${fighter(m.a,m.hpA,m.gearA,false)}<div class="big" style="padding-top:20px">${m.scoreA} – ${m.scoreB}</div>${fighter(m.b,m.hpB,m.gearB,true)}</div></div>`).join(''):'<div class="empty">No matches right now.</div>';
  window.LIVEN=l.length;sum();
}catch(e){conn(false)}}
function conn(ok){const c=$('#conn');if(!c)return;c.classList.toggle('off',!ok);c.lastElementChild.textContent=ok?'live':'reconnecting…'}
async function bk(){try{bracket(await (await fetch('/api/bracket')).json());conn(true)}catch(e){conn(false)}}
function sum(){
  const s=(window.BK&&window.BK.series)||[], done=s.filter(x=>x.state==='done').length, ST=window.ST;
  const players=ST?Object.keys(ST.players).length:0, matches=ST?ST.history.length:0;
  $('#sumstats').innerHTML=[['Live now',window.LIVEN||0],['Series played',s.length?done+'/'+s.length:'—'],['Players tracked',players],['Matches logged',matches]].map(([k,v])=>`<div class="stat"><b>${v}</b><span>${k}</span></div>`).join('')}
function nextUp(s){
  const nx=s.filter(x=>x.state==='pending'&&x.a&&x.b).slice(0,4);
  $('#nextup').innerHTML=nx.length?`<div class="sec">Up next<i></i></div><div class="next">${nx.map(x=>`<div class="nx">${head(x.a)}${esc(x.a)}<span class="vs2">vs</span>${head(x.b)}${esc(x.b)}<span class="mute">· ${esc(x.label.replace(/ \(.*/,''))}</span></div>`).join('')}</div>`:''}
function profile(n){
  const r=window.ST&&window.ST.players[n];if(!r)return;
  const kits=Object.entries(r.kits).sort((a,b)=>(b[1][0]+b[1][1])-(a[1][0]+a[1][1]));
  $('#dlg').innerHTML=`<h3>${esc(n)}</h3><div class="mute">${r.matchesWon}-${r.matchesLost} matches · ${pct(r.matchesWon,r.matchesLost)} · rounds ${r.roundsWon}-${r.roundsLost}</div>
  <div style="margin-top:12px">${kits.length?kits.map(([k,v])=>`<div class="kitrow"><span>${esc(k)}</span><div class="pbar"><i style="width:${v[0]+v[1]?100*v[0]/(v[0]+v[1]):0}%"></i></div><span class="mute">${v[0]}-${v[1]}</span></div>`).join(''):'<div class="mute">No rounds yet.</div>'}</div>
  <p style="margin-top:14px"><button onclick="this.closest('dialog').close()">Close</button></p>`;$('#dlg').showModal()}
async function stats(){try{
  const s=await (await fetch('/api/stats')).json();window.ST=s;sum();
  const rows=Object.entries(s.players).map(([n,r])=>{let best='-',bw=-1;for(const[k,v]of Object.entries(r.kits)){const t=v[0]+v[1],sc=v[0]/(t||1)+t/1000;if(t>=2&&sc>bw){bw=sc;best=k+' '+pct(v[0],v[1])}}return{n,r,best,m:r.matchesWon+r.matchesLost}}).sort((a,b)=>b.r.matchesWon-a.r.matchesWon||b.m-a.m);
  $('#board tbody').innerHTML=rows.length?rows.map((x,i)=>`<tr class="pl" data-n="${esc(x.n)}"><td>${i+1}</td><td style="display:flex;gap:8px;align-items:center"><span style="width:20px">${head(x.n)}</span><b>${esc(x.n)}</b></td><td class="n">${x.r.matchesWon}-${x.r.matchesLost}</td><td class="n">${pct(x.r.matchesWon,x.r.matchesLost)}</td><td class="n hide">${x.r.roundsWon}-${x.r.roundsLost}</td><td class="hide">${esc(x.best)}</td></tr>`).join(''):'<tr><td colspan="6" class="empty">No finished matches yet.</td></tr>';
  document.querySelectorAll('tr.pl').forEach(t=>t.onclick=()=>profile(t.dataset.n));
  $('#hist tbody').innerHTML=s.history.length?s.history.map(h=>`<tr><td style="display:flex;gap:8px;align-items:center"><span style="width:20px">${head(h.winner)}</span><b>${esc(h.winner)}</b>&nbsp;beat ${esc(h.loser)}</td><td class="n">${h.winnerScore}–${h.loserScore}</td><td class="hide"><span class="tag">${esc(h.kit)}</span></td><td class="hide mute">${esc(h.event||'')}</td><td class="mute n">${new Date(h.endedAt).toLocaleTimeString()}</td></tr>`).join(''):'<tr><td class="empty">Nothing yet.</td></tr>';
}catch(e){}}
bk();live();stats();setInterval(bk,3000);setInterval(live,2000);setInterval(stats,6000);
</script></body></html>
