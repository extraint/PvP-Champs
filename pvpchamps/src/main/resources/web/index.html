<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PvP Champs Bracket</title>
<style>
:root{--bg:#0b0d12;--panel:#12151c;--card:#171b24;--line:#232937;--text:#eef1f7;--mute:#8791a5;--gold:#f5b942;--live:#ff4d5e;--accent:#7c8cff}
@media (prefers-color-scheme:light){:root{--bg:#f3f5f9;--panel:#fff;--card:#fff;--line:#d9dfe9;--text:#161b26;--mute:#5f6b80;--gold:#c98a00;--live:#d9263a;--accent:#4655e0}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--text);font:14px/1.4 Inter,system-ui,Segoe UI,sans-serif}
header{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top{max-width:1500px;margin:0 auto;padding:14px 16px 0;display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.logo{font-weight:800;letter-spacing:.06em;font-size:20px}.logo b{color:var(--gold)}
.sub{color:var(--mute);font-size:12px;padding-bottom:3px}
nav{display:flex;gap:2px;margin-left:auto;overflow-x:auto}
nav button{background:none;border:0;color:var(--mute);padding:10px 14px;font:inherit;font-weight:600;cursor:pointer;border-bottom:2px solid transparent}
nav button.on{color:var(--text);border-color:var(--gold)}
main{max-width:1500px;margin:0 auto;padding:18px 16px 60px}
.sec{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:22px 0 10px;display:flex;align-items:center;gap:10px}
.sec i{flex:1;height:1px;background:var(--line)}
.scroll{overflow-x:auto;padding-bottom:8px}.grid{display:flex;gap:34px;min-width:max-content}
.col{display:flex;flex-direction:column;width:210px}
.colh{font-size:12px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;display:flex;justify-content:space-between}
.col .ms{flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:10px}
.m{background:var(--card);border:1px solid var(--line);border-radius:8px;position:relative;cursor:pointer;transition:border-color .15s}
.m:hover{border-color:var(--accent)}
.m.live{border-color:var(--live);box-shadow:0 0 0 1px var(--live) inset}
.col:not(:last-child) .m::after{content:"";position:absolute;right:-18px;top:50%;width:18px;border-top:2px solid var(--line)}
.col:not(:first-child) .m::before{content:"";position:absolute;left:-18px;top:50%;width:18px;border-top:2px solid var(--line)}
.p{display:flex;align-items:center;gap:8px;padding:7px 9px;height:32px}
.p+.p{border-top:1px solid var(--line)}.p:first-child{border-radius:7px 7px 0 0}.p:last-child{border-radius:0 0 7px 7px}
.p img{width:18px;height:18px;border-radius:3px;image-rendering:pixelated;background:var(--line)}
.p .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.p .sc{font-variant-numeric:tabular-nums;font-weight:700;min-width:14px;text-align:right}
.p.tbd .nm{color:var(--mute);font-weight:400;font-style:italic}
.p.win{background:linear-gradient(90deg,rgba(245,185,66,.16),transparent)}.p.win .sc{color:var(--gold)}
.p.lose{opacity:.5}
.badge{position:absolute;top:-8px;right:8px;background:var(--live);color:#fff;font-size:10px;font-weight:800;padding:1px 6px;border-radius:99px;letter-spacing:.06em}
.badge::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#fff;margin-right:4px;animation:p 1.2s infinite}@keyframes p{50%{opacity:.25}}
.champ{background:linear-gradient(135deg,rgba(245,185,66,.2),transparent);border:1px solid var(--gold);border-radius:10px;padding:16px;text-align:center;margin-top:12px;width:210px}
.champ small{color:var(--gold);letter-spacing:.14em;font-weight:700}.champ div{font-size:20px;font-weight:800;margin-top:4px}
.empty{color:var(--mute);padding:30px 0;text-align:center}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center}
.vs .big{font-size:28px;font-weight:800;text-align:center;min-width:90px}.r{text-align:right}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%}
.tag{background:var(--line);border-radius:99px;padding:2px 9px;font-size:12px}
table{width:100%;border-collapse:collapse}th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--mute);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.05em}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.mute{color:var(--mute)}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:20px;min-width:300px;max-width:440px}
dialog::backdrop{background:rgba(0,0,0,.6)}dialog h3{margin:0 0 4px}dialog ul{padding-left:18px;margin:10px 0}
dialog button{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 14px;cursor:pointer}
.gear{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.arm{display:flex;gap:6px;margin-bottom:8px}.r .arm{justify-content:flex-end}
.pc{width:52px}.pc small{display:block;color:var(--mute);font-size:10px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .d{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.pc .d i{display:block;height:100%}
.pc em{font-style:normal;font-size:11px;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:4px}.r .chips{justify-content:flex-end}
.chip{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-size:12px;white-space:nowrap}
.chip.hb{border-color:var(--accent)}.gl{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em;margin:6px 0 3px}
.view{display:none}.view.on{display:block}
@media(max-width:560px){.hide{display:none}}
</style></head><body>
<header><div class="top"><div class="logo">PVP <b>CHAMPS</b> II</div><div class="sub" id="sub">Double elimination · 16 players</div>
<nav><button data-v="bracket" class="on">Bracket</button><button data-v="live">Live</button><button data-v="board">Leaderboard</button><button data-v="results">Results</button></nav></div></header>
<main>
<div class="view on" id="v-bracket"><div id="bk"></div></div>
<div class="view" id="v-live"><div id="live"></div></div>
<div class="view" id="v-board"><div class="panel"><table id="board"><thead><tr><th>#</th><th>Player</th><th class="n">Matches</th><th class="n">Win %</th><th class="n hide">Rounds</th><th class="hide">Best kit</th></tr></thead><tbody></tbody></table></div></div>
<div class="view" id="v-results"><div class="panel"><table id="hist"><tbody></tbody></table></div></div>
</main>
<dialog id="dlg"></dialog>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct=(w,l)=>w+l?Math.round(100*w/(w+l))+'%':'-';
const head=n=>`<img src="https://mc-heads.net/avatar/${encodeURIComponent(n)}/36" alt="" onerror="this.style.visibility='hidden'">`;
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button,.view').forEach(e=>e.classList.remove('on'));b.classList.add('on');$('#v-'+b.dataset.v).classList.add('on')});

{const t=location.hash.slice(1);const b=t&&document.querySelector(`nav button[data-v="${t}"]`);if(b)b.click()}
let SER=[];
function card(s){
  const sc=(s.score||'').split('-'), done=s.state==='done';
  const row=(n,mine)=>{
    if(!n)return `<div class="p tbd"><span class="nm">TBD</span><span class="sc"></span></div>`;
    const win=done&&s.winner===n, lose=done&&s.winner!==n;
    const v=done&&sc.length===2?(win?sc[0]:sc[1]):'';
    return `<div class="p ${win?'win':''} ${lose?'lose':''}">${head(n)}<span class="nm">${esc(n)}</span><span class="sc">${v}</span></div>`};
  return `<div class="m ${s.state==='live'?'live':''}" data-n="${s.n}">${s.state==='live'?'<span class="badge">LIVE</span>':''}${row(s.a)}${row(s.b)}</div>`;
}
function col(title,list){return `<div class="col"><div class="colh"><span>${title}</span><span>Bo${list[0]?.bestOf||3}</span></div><div class="ms">${list.map(card).join('')}</div></div>`}
function bracket(d){
  const s=d.series||[]; SER=s;
  if(!s.length){$('#bk').innerHTML='<div class="empty">No tournament running yet.<br>In the game, run <b>/pvpchamps tournament start</b> and the bracket fills in here live.</div>';return}
  const by=p=>s.filter(x=>x.label.startsWith(p));
  const up=[['Round 1','Upper Round 1'],['Round 2','Upper Round 2'],['Round 3','Upper Round 3'],['Upper Final','Upper Final']];
  const lo=[['Round 1','Lower Round 1'],['Round 2','Lower Round 2'],['Round 3','Lower Round 3'],['Round 4','Lower Round 4'],['Round 5','Lower Round 5'],['Lower Final','Lower Final']];
  const live=s.find(x=>x.state==='live');
  $('#sub').textContent=d.finished?`Finished · ${d.champion} wins`:live?`${live.label.replace(/ \(.*/,'')} · ${live.a||'TBD'} vs ${live.b||'TBD'}`:'Double elimination · 16 players';
  const gf=by('Grand Final')[0];
  $('#bk').innerHTML=`<div class="sec">Upper bracket<i></i></div><div class="scroll"><div class="grid">${up.map(([t,p])=>col(t,by(p))).join('')}${col('Grand Final',[gf])}</div></div>
  <div class="sec">Lower bracket<i></i></div><div class="scroll"><div class="grid">${lo.map(([t,p])=>col(t,by(p))).join('')}</div></div>
  ${d.champion?`<div class="champ"><small>CHAMPION</small><div>${esc(d.champion)}</div></div>`:''}`;
  document.querySelectorAll('.m').forEach(m=>m.onclick=()=>detail(+m.dataset.n));
}
function detail(n){
  const s=SER[n-1]; if(!s)return;
  $('#dlg').innerHTML=`<h3>${esc(s.label)}</h3><div class="mute">Best of ${s.bestOf} · ${s.state==='live'?'in progress':s.state==='done'?'finished':'not played yet'}</div>
  <p><b>${esc(s.a||'TBD')}</b> vs <b>${esc(s.b||'TBD')}</b>${s.winner?`<br>Winner: <b>${esc(s.winner)}</b>${s.score?' ('+esc(s.score)+')':' (skipped)'}`:''}</p>
  ${s.draft?.length?`<div class="mute">Kit draft</div><ul>${s.draft.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
  <button onclick="this.closest('dialog').close()">Close</button>`;
  $('#dlg').showModal();
}
const nice=id=>{const[b,p]=String(id).split(':');return b.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase())+(p?' ('+p.replace(/_/g,' ')+')':'')};
const cnt=t=>{const m=t.match(/^(.*?) x(\d+)$/);return m?nice(m[1])+' ×'+m[2]:nice(t)};
const durCol=v=>v>60?'#3ddc97':v>30?'#f5b942':'#ff4d5e';
const PIECES=['Helmet','Chest','Legs','Boots'];
function gear(g){ if(!g)return '';
  const arm=g.armor.map((a,i)=>`<div class="pc" title="${a?esc(nice(a)):'empty'}"><small>${PIECES[i]}</small><div class="d"><i style="width:${a?g.armorDura[i]:0}%;background:${durCol(g.armorDura[i])}"></i></div><em>${a?g.armorDura[i]+'%':'—'}</em></div>`).join('');
  const hb=(g.hotbar||[]).filter(x=>x).map(x=>`<span class="chip hb">${esc(cnt(x))}</span>`).join('');
  const mats=Object.entries(g.materials||{}).map(([k,v])=>`<span class="chip">${esc(nice(k))} ×${v}</span>`).join('');
  return `<div class="gear"><div class="arm">${arm}</div><div class="gl">Hotbar</div><div class="chips">${hb||'<span class="mute">empty</span>'}</div><div class="gl">Materials</div><div class="chips">${mats}</div></div>`}
const hp=v=>Math.max(0,Math.min(100,v/20*100));
async function live(){try{
  const l=await (await fetch('/api/live')).json();
  $('#live').innerHTML=l.length?l.map(m=>`<div class="panel"><div style="display:flex;gap:10px;align-items:center"><span class="tag">${esc(m.kit)}</span><span class="mute">${esc(m.round||'')}</span><span style="flex:1"></span><span class="mute">best of ${m.bestOf}</span></div>
  <div class="vs" style="margin-top:12px"><div><b>${esc(m.a)}</b><div class="bar"><i style="width:${hp(m.hpA)}%;background:var(--accent)"></i></div><div class="mute">${(m.hpA/2).toFixed(1)} hearts</div>${gear(m.gearA)}</div>
  <div class="big">${m.scoreA} – ${m.scoreB}</div>
  <div class="r"><b>${esc(m.b)}</b><div class="bar"><i style="width:${hp(m.hpB)}%;background:var(--live);margin-left:auto"></i></div><div class="mute">${(m.hpB/2).toFixed(1)} hearts</div>${gear(m.gearB)}</div></div></div>`).join(''):'<div class="empty">No matches right now.</div>';
}catch(e){}}
async function bk(){try{bracket(await (await fetch('/api/bracket')).json())}catch(e){}}
async function stats(){try{
  const s=await (await fetch('/api/stats')).json();
  const rows=Object.entries(s.players).map(([n,r])=>{let best='-',bw=-1;for(const[k,v]of Object.entries(r.kits)){const t=v[0]+v[1],sc=v[0]/(t||1)+t/1000;if(t>=2&&sc>bw){bw=sc;best=k+' '+pct(v[0],v[1])}}return{n,r,best,m:r.matchesWon+r.matchesLost}}).sort((a,b)=>b.r.matchesWon-a.r.matchesWon||b.m-a.m);
  $('#board tbody').innerHTML=rows.length?rows.map((x,i)=>`<tr><td>${i+1}</td><td style="display:flex;gap:8px;align-items:center"><span style="width:20px">${head(x.n)}</span><b>${esc(x.n)}</b></td><td class="n">${x.r.matchesWon}-${x.r.matchesLost}</td><td class="n">${pct(x.r.matchesWon,x.r.matchesLost)}</td><td class="n hide">${x.r.roundsWon}-${x.r.roundsLost}</td><td class="hide">${esc(x.best)}</td></tr>`).join(''):'<tr><td colspan="6" class="empty">No finished matches yet.</td></tr>';
  $('#hist tbody').innerHTML=s.history.length?s.history.map(h=>`<tr><td><b>${esc(h.winner)}</b> beat ${esc(h.loser)}</td><td class="n">${h.winnerScore}–${h.loserScore}</td><td class="hide"><span class="tag">${esc(h.kit)}</span></td><td class="hide mute">${esc(h.event||'')}</td><td class="mute n">${new Date(h.endedAt).toLocaleTimeString()}</td></tr>`).join(''):'<tr><td class="empty">Nothing yet.</td></tr>';
}catch(e){}}
bk();live();stats();setInterval(bk,3000);setInterval(live,2000);setInterval(stats,6000);
</script></body></html>
